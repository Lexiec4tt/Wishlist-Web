<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
	<title>
		Wishlist
	</title>
	<link rel="stylesheet" href="css/styles.css">
	<script type="module" src="js/main.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
	<header id="main-header">
		<nav>
			<ul>
				<li><a href=index.html>🏠Home</a></li>
				<li><a href=wishlist.html>🎁My Wishlist</a></li>
				<li><a href=explore.html>👤View Other Wishlists</a></li>
				<li class="dropdown">
					<button id="settingsBtn">⚙ Settings</button>

					<ul id="settingsMenu" class="dropdown-menu hidden">
						<li><button id="theme-toggle">🌙 Dark Mode</button></li>
						<li><button id="logoutBtn" hidden>🚪 Log Out</button></li>
					</ul>
				</li>
			</ul>
		</nav>
		<h1>💜DreamList💚</h1>
	</header>
	
	<div class="flexing">
		<aside id="aside" hidden>
			<section id="wishlist-edit" hidden>
					<h3>Add an Item</h3>
					<form id="wishlist-form">
						<label for="item-name">Item name:</label>
						<input type="text" id="item-name" name="item-name" required>
						<label for="item-link">Item link:</label>
						<textarea type="url" id="item-link" name="item-link" placeholder="https://..." required></textarea>
						<label for="item-desc">Description/Specification:</label>
						<textarea id="item-desc" name="item-desc" rows="4" placeholder="Enter a description or specification for the item..." required></textarea>
						<label for="priority">Priority Level:</label>
						<select id="priority" name="item-priority" required>
							<option value="" disabled selected>Select a priority</option>
							<option value="low">Low</option>
							<option value="medium">Medium</option>
							<option value="high">High</option>
						</select>
						<button type="submit">Save Item</button>
					</form>
				</section>

		</aside>
		<main>
				<h2 id="wishlist-name">My Wishlist</h2>
				
				<section id="wishlist-container" hidden>
					
				</section>
				
				<template id="wishlist-template">
						<article class="wishlist-card template">
							<h3><a class="Item-link" href=#>Item Name</a></h3>
							<p class="desc">Description/Specification:</p>
							<p class="priority">Priority level:</p>
							<small class="date">Added:</small>
								<label class="received-label" for="received-checkbox">
									<input type="checkbox" class="received-checkbox" disabled>Received</label>
								<button class="reserveBtn" hidden>Reserve</button>	
								<button class="editBtn" hidden>Edit</button>
								<button class="deleteBtn" hidden>Delete</button>
							<p class="reservedMsg" hidden>This item has been reserved by someone else to gift!</p>
						</article>
					</template>

				<button id="loadMoreBtn" hidden>Load More</button>

				
				<section id="logged-out" hidden>
					<h2> Please Log in before Proceeding. </h2>
				</section>
				
		</main>
	</div>
</body>
</html>
